<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti 🌻</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101b3d;
            color: #f5d76e;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .contenedor {
            width: 90%;
            max-width: 900px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: white;
            font-size: 18px;
            margin-bottom: 25px;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Para ti 🌻</h1>

        <p>No sabía qué regalarte, así que hice esto :)</p>

        <iframe
            src="https://www.geogebra.org/calculator/wmvrbtcb">
        </iframe>

    </div>

</body>
</html>
